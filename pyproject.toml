[project]
name = "ai-peer-review"
version = "0.1.0"
description = "AI-based peer review of academic papers using locally-served LLMs"
readme = "README.md"
authors = [
    { name = "Russell Poldrack", email = "poldrack@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "click",
    "pypdf",
    "openai>=1.0",
    "python-dotenv",
    "pandas",
    "pytest>=8.3.5",
]

[project.scripts]
ai-peer-review = "ai_peer_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
